<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffae00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#151515;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff4d00" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative corner accents -->
  <path d="M 0 0 L 120 0 L 120 8 L 8 8 L 8 120 L 0 120 Z" fill="url(#fireGradient)" opacity="0.8"/>
  <path d="M 1200 630 L 1080 630 L 1080 622 L 1192 622 L 1192 510 L 1200 510 Z" fill="url(#fireGradient)" opacity="0.8"/>

  <!-- Accent lines -->
  <rect x="60" y="280" width="4" height="120" fill="url(#fireGradient)" opacity="0.6"/>
  <rect x="1136" y="230" width="4" height="120" fill="url(#fireGradient)" opacity="0.6"/>

  <!-- Main content area -->
  <g transform="translate(600, 315)">
    <!-- Company name -->
    <text x="0" y="-80" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#fireGradient)" text-anchor="middle" filter="url(#glow)">
      R BORROMEO
    </text>
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="48" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="12">
      SOFTWARES
    </text>

    <!-- Divider line -->
    <rect x="-200" y="30" width="400" height="2" fill="url(#fireGradient)" opacity="0.8"/>

    <!-- Tagline -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="28" fill="#b0b0b0" text-anchor="middle" letter-spacing="4">
      DIGITAL INNOVATION
    </text>

    <!-- Stats bar -->
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="18" fill="#ff4d00" text-anchor="middle" letter-spacing="2">
      15+ YEARS EXPERIENCE  |  50+ PROJECTS  |  100% SATISFACTION
    </text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#fireGradient)"/>
</svg>